name: Decode icons
on:
  push:
    paths: ["icons/*.b64", ".github/workflows/icons.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNGs
        run: |
          python3 -c "import base64,glob; [open(f[:-4],'wb').write(base64.b64decode(open(f).read())) for f in glob.glob('icons/*.png.b64')]"
          ls -la icons
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          git diff --cached --quiet || git commit -m "Decode PNG icons"
          git push origin "HEAD:${GITHUB_REF_NAME}"
